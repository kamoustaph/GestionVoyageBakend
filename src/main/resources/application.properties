# Il est souvent inutile de spécifier l'URI de redirection car Spring la génère automatiquement.
# La ligne du dessus suffit. La propriété suivante est généralement utilisée pour la PROVIDER,
# pas pour la registration. Vous pouvez probablement la SUPPRIMER.
