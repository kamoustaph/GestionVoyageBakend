# =====================================================================
# Yoon - configuration commune
# Profil par défaut : développement local avec H2 en mémoire (aucune installation).
# Profil "prod" : MySQL (RDS) configuré par variables d'environnement.
# =====================================================================
spring:
  application:
    name: gestion-voyage
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
  jackson:
    time-zone: Africa/Dakar
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:mem:yoon;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8093}
  forward-headers-strategy: framework
  shutdown: graceful

app:
  jwt:
    # En production : variable JWT_SECRET obligatoire (longue chaîne aléatoire).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  qr:
    # Signe les QR codes. En production : variable QR_SECRET obligatoire. La changer invalide les billets émis.
    secret: ${QR_SECRET:dev-only-qr-secret-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  reservation:
    delai-paiement-minutes: 15
  controle:
    heures-avant-depart: 12
    heures-apres-depart: 6
  demo:
    enabled: ${DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
