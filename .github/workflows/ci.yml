# Intégration continue du backend :
# - à chaque pull request et push sur main : compilation + tests (H2 en mémoire) ;
# - sur main : construction de l'image Docker et publication sur GitHub Container Registry (ghcr.io).
name: Backend CI

on:
  pull_request:
  push:
    branches: [main, mai]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compiler et tester
        run: mvn -B verify

  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mai')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestion-voyage-api:latest
            ghcr.io/${{ github.repository_owner }}/gestion-voyage-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
