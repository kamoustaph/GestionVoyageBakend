services:
  mysql-db:
    image: mysql:8.0
    container_name: gestionvoyage-mysql
    init: true
    environment:
      MYSQL_ROOT_PASSWORD: 771577089
      MYSQL_DATABASE: gestionVoyage
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gestionvoyage-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailhog_data:/maildir

  spring-app:
    build: .
    container_name: gestionvoyage-spring
    depends_on:
      - mysql-db
    environment:
      SERVER_PORT: 8093
    ports:
      - "8094:8093"
    volumes:
      - app_logs:/app/logs

volumes:
  mysql_data:
  mailhog_data:
  app_logs: